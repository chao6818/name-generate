<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="妙名坊根据父母姓名中的寓意，为宝宝生成全新的姓名参考。">
  <title>妙名坊 · 父母姓名参考起名</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.94 14.34 4.2 15.6a.8.8 0 0 0-.34 1.38l4.94 4.94a.8.8 0 0 0 1.38-.34l1.26-5.74"/>
            <path d="M13.5 4.5 14 6.5l2 .5-2 .5-.5 2-.5-2-2-.5 2-.5z"/>
            <path d="M17.5 12.5 18 13.8l1.3.4-1.3.4-.5 1.3-.5-1.3-1.3-.4 1.3-.4z"/>
            <path d="m3.5 8.5 1-2 2-1-2-1-1-2-1 2-2 1 2 1z"/>
          </svg>
        </span>
        <div class="brand-text">
          <strong>妙名坊</strong>
          <span>父母姓名参考起名</span>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="control-panel" aria-label="起名设置">
        <div class="panel-head">
          <h1>起名设置</h1>
          <span class="panel-kicker">NAME STUDIO</span>
        </div>

        <div class="field-group">
          <label for="fatherInput">父亲姓名</label>
          <input id="fatherInput" type="text" maxlength="8" placeholder="如：李建国" autocomplete="off">
        </div>

        <div class="field-group">
          <label for="motherInput">母亲姓名</label>
          <input id="motherInput" type="text" maxlength="8" placeholder="如：王慧芳" autocomplete="off">
        </div>

        <div class="field-group">
          <label>宝宝姓氏</label>
          <div class="segmented compact" id="surnameTabs" role="group" aria-label="宝宝姓氏">
            <button type="button" class="segment" data-source="father">父姓</button>
            <button type="button" class="segment" data-source="mother">母姓</button>
            <button type="button" class="segment active" data-source="none">不显示</button>
          </div>
        </div>

        <div class="field-group">
          <label>出生年月</label>
          <div class="select-row">
            <select id="birthYear" aria-label="出生年份">
              <option value="2015">2015年</option>
              <option value="2016">2016年</option>
              <option value="2017">2017年</option>
              <option value="2018">2018年</option>
              <option value="2019">2019年</option>
              <option value="2020">2020年</option>
              <option value="2021">2021年</option>
              <option value="2022">2022年</option>
              <option value="2023">2023年</option>
              <option value="2024">2024年</option>
              <option value="2025">2025年</option>
              <option value="2026" selected>2026年</option>
              <option value="2027">2027年</option>
              <option value="2028">2028年</option>
              <option value="2029">2029年</option>
              <option value="2030">2030年</option>
            </select>
            <select id="birthMonth" aria-label="出生月份">
              <option value="1">1月</option>
              <option value="2">2月</option>
              <option value="3">3月</option>
              <option value="4">4月</option>
              <option value="5">5月</option>
              <option value="6">6月</option>
              <option value="7">7月</option>
              <option value="8" selected>8月</option>
              <option value="9">9月</option>
              <option value="10">10月</option>
              <option value="11">11月</option>
              <option value="12">12月</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label>性别倾向</label>
          <div class="segmented compact" id="genderTabs" role="group" aria-label="性别倾向">
            <button type="button" class="segment active" data-gender="neutral">不限</button>
            <button type="button" class="segment" data-gender="male">男孩</button>
            <button type="button" class="segment" data-gender="female">女孩</button>
          </div>
        </div>

        <div class="field-group">
          <label>名字风格</label>
          <div class="chip-grid" id="styleChips" aria-label="名字风格">
            <button type="button" class="chip active" data-style="elegant">雅致</button>
            <button type="button" class="chip active" data-style="modern">现代</button>
            <button type="button" class="chip active" data-style="bold">大气</button>
            <button type="button" class="chip active" data-style="fresh">清新</button>
            <button type="button" class="chip active" data-style="classic">古风</button>
            <button type="button" class="chip active" data-style="cute">可爱</button>
            <button type="button" class="chip active" data-style="cool">酷感</button>
            <button type="button" class="chip active" data-style="warm">温暖</button>
          </div>
        </div>

        <div class="field-group">
          <label>名字长度</label>
          <div class="segmented compact" id="lengthTabs" role="group" aria-label="名字长度">
            <button type="button" class="segment" data-length="short">两字</button>
            <button type="button" class="segment active" data-length="any">不限</button>
            <button type="button" class="segment" data-length="long">三字</button>
          </div>
        </div>

        <div class="field-group">
          <div class="range-head">
            <label for="countRange">生成数量</label>
            <output id="countOutput" for="countRange">12</output>
          </div>
          <input id="countRange" type="range" min="5" max="30" value="12" step="1">
        </div>

        <button class="generate-button" id="generateButton" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M8 8h.01"/><path d="M12 8h.01"/><path d="M16 8h.01"/>
            <path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/>
            <path d="M8 16h.01"/><path d="M12 16h.01"/><path d="M16 16h.01"/>
          </svg>
          <span>生成名字</span>
        </button>
      </section>

      <section class="results-panel" aria-label="起名结果">
        <div class="results-head">
          <div>
            <h2 id="resultsTitle">起名结果</h2>
            <p id="resultsSubtitle"></p>
          </div>
          <button class="icon-button" id="shuffleButton" type="button" aria-label="换一批" title="换一批">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 14 4 4-4 4"/>
              <path d="m18 2 4 4-4 4"/>
              <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/>
              <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/>
              <path d="M22 22h-6.04a4 4 0 0 1-3.3-1.8l-.64-.96"/>
            </svg>
          </button>
        </div>

        <div class="reference-strip" id="referenceStrip" hidden></div>
        <div class="name-grid" id="nameGrid"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
